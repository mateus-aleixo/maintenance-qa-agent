[project]
name = "conformal-rag"
version = "0.1.0"
description = "RAG over industrial maintenance manuals with conformal abstention: answers carry a calibrated error guarantee, or the system declines."
authors = [{ name = "Mateus Filipe Aleixo", email = "mateusfilipealeixo@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
export = ["torch>=2.2", "transformers>=4.40", "sentence-transformers>=3.0", "onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "mangum>=0.17",
    "pydantic>=2.6",
]
# The MS MARCO scale benchmark in scale/. Embedding 8.8 million passages also needs a
# CUDA build of torch, installed by hand: see scale/README.md.
scale = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "PyStemmer>=2.2", "bm25s>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.4", "fastapi>=0.110", "httpx>=0.27", "onnxruntime>=1.18", "tokenizers>=0.20"]

[project.urls]
Repository = "https://github.com/mateus-aleixo/maintenance-qa-agent"
"RUL API" = "https://github.com/mateus-aleixo/turbofan-rul"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# scale/ is a top-level package beside src/, imported by its tests.
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
# Same rule set as turbofan-rul and defect-segmentation.
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI declares dependencies as argument defaults. Calling Query() in the
# signature is the framework's required idiom, not a mutable-default bug.
"src/conformal_rag/serve/app.py" = ["B008"]
# E501 only where the long line IS the artifact: prompt text sent verbatim to a
# model, and a 477-character golden-set fixture. Rewrapping those edits the thing
# under test. Correctness rules stay on everywhere.
"src/conformal_rag/guard.py" = ["E501"]
"src/conformal_rag/scores.py" = ["E501"]
"scripts/verify_golden.py" = ["E501"]
# scripts/ are one-off analysis runs whose long lines are print statements.
"scripts/*.py" = ["E501"]
