name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts scale
      - name: Test (deterministic — no models, no network)
        run: pytest

  image:
    name: serving image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # models/ is not in git, so this builds an image with an empty registry.
      # That is the point: it proves the container assembles and starts, and that
      # a registry-less deploy degrades to 503 rather than crashing.
      - name: Build
        run: docker build -t conformal-rag:ci .

      # The image installs the package with --no-deps on top of a pinned, torch-free
      # requirements set. That is easy to break from pyproject and the breakage is
      # invisible until someone looks at a 2 GB image.
      - name: Assert the image is torch-free
        run: |
          for mod in torch sentence_transformers pypdf; do
            if docker run --rm conformal-rag:ci python -c "import $mod" 2>/dev/null; then
              echo "::error::$mod reached the serving image" && exit 1
            fi
          done
          echo "confirmed: no torch, sentence-transformers or pypdf in the image"
          docker image inspect conformal-rag:ci --format 'image size: {{.Size}} bytes'

      # Lambda mounts everything outside /tmp read-only, and SQLite fails there in
      # three separate ways (WAL sidecars on open, FTS5 scratch on query, journal
      # mode in the file header). Those cost three deploys to find. Run the
      # container the way Lambda does so they cannot come back unnoticed.
      - name: Start under a read-only filesystem, as Lambda does
        run: |
          docker run -d --name api --read-only --tmpfs /tmp -p 8000:8000 conformal-rag:ci
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health && break
            sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          # No registry is committed, so the data routes must answer 503, not 500.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/gates)" = "503"
          docker rm -f api
